<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Альманах База</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <!-- Plyr player CSS -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #121214;
      --card-bg: rgba(34,37,53,0.74);
      --blur: blur(8px);
      --accent:a484ff;
      --active: #9e71fe;
      -- #70e9f8;
      --accent2: #radius12: 12px;
      --radius16: 16px;
      --shadow: 0 2px 24px 0 #11171c73, 0 1px 1.5px 0 #46209336;
      --trans: 0.17s cubic-bezier(.53,.21,.29,.67);
    }
    body {
      background: var(--bg-dark);
      color: #fafdff;
      font-family: 'Montserrat', Arial, sans-serif;
      margin: 0; min-height: 100vh;
      letter-spacing: .05em;
    }
    .nav-bar {
      width: 100vw;
      background: rgba(18,18,20,0.92);
      backdrop-filter: blur(8px);
      display: flex; align-items: center;
      box-shadow: 0 4px 24px 0 #05081b9a;
      padding: 0;
      min-height: 72px;
      z-index: 10;
      position: sticky; top: 0;
      user-select: none;
    }
    .logo-avatar {
      width: 54px; height: 54px;
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      margin-left: 32px;
      margin-right: 18px;
      box-shadow: 0 0 0 4px var(--accent2), 0 3px 12px 3px #29114688;
      background: #232334;
      flex-shrink: 0;
    }
    .logo-avatar img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      background: #232334;
    }
    .logo-text {
      font-weight: 800;
      font-size: 2.04rem;
      color: #fafdff;
      letter-spacing: 2.5px;
      text-shadow: 0 2px 14px var(--accent2);
    }
    @media (max-width: 600px) {
      .nav-bar { min-height:60px; }
      .logo-avatar { width:38px; height:38px; margin-left:12px; }
      .logo-text { font-size: 1.12rem; }
    }
    /* Каталог */
    #catalog-screen { padding:34px 4vw 70px 4vw; }
    .anime-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
      gap:28px 18px;
    }
    .anime-card {
      background: var(--card-bg);
      border-radius: var(--radius16);
      box-shadow: var(--shadow);
      overflow: hidden;
      backdrop-filter: var(--blur);
      border: 2px solid transparent;
      cursor: pointer;
      transition: box-shadow var(--trans), border-color var(--trans), transform var(--trans);
      display: flex; flex-direction: column; align-items: center;
      position: relative;
    }
    .anime-card:hover, .anime-card:focus-visible {
      border-color: var(--accent2);
      box-shadow: 0 4px 32px 0 var(--accent2), 0 5px 24px 0 #56b4db2d;
      transform: translateY(-2px) scale(1.02);
      z-index: 1;
    }
    .anime-poster {
      width: 100%; aspect-ratio: 3/4;
      object-fit: cover; display: block;
      border-radius: 0 0 var(--radius16) var(--radius16);
      background: #192029;
      min-height: 230px;
      max-height: 310px;
    }
    .anime-info {
      width: 93%; margin:12px auto 14px auto;
      text-align: left;
      display: flex; flex-direction: column; gap:4px;
    }
    .anime-title {
      font-size: 1.073rem;
      font-weight: 700;
      color: #fafdff;
      margin-bottom: 1px;
      text-shadow: 0 1px 7px #0cf0ff18,0 0px 1px var(--accent2);
      transition: color var(--trans);
      line-height: 1.22em;
      word-break: break-word;
    }
    .anime-genres {
      font-size:0.88rem; color:#66b0ffda; font-weight:500;
      white-space: normal;
      margin-bottom: 2px;
      opacity:.86;
    }
    .anime-rating {
      font-size: .96rem;
      color: var(--accent);
      font-weight: bold;
      background: #171c228e;
      border-radius: 9px;
      padding: 1.5px 8px;
      display: inline-block;
      margin-top: 5px;
      align-self: flex-start;
      box-shadow: 0 0 7px 0 var(--accent2)44;
    }
    #anime-screen {
      display:none;
      min-height: 96vh;
      padding: 0 3vw 28px 3vw;
      animation: fadein .4s;
    }
    @keyframes fadein { from {opacity:0} to {opacity:1;} }
    .animepage-top {
      display:flex; gap:40px; align-items:flex-start; flex-wrap: wrap;
      margin-bottom: 17px;
    }
    .animepage-poster {
      width: 220px; max-width:95vw;
      border-radius: var(--radius16);
      background: #192029;
      object-fit: cover;
      min-height: 310px;
      box-shadow:0 6px 36px 2px #6c21ea3e, 0 0 12px 2px var(--accent2);
    }
    .animepage-desc-box {
      flex:1; min-width:220px;
      display: flex; flex-direction: column; gap:7px;
      margin-top:7px;
    }
    .animepage-title {
      font-size: 1.37rem;
      color: #fafdff;
      font-weight: 800;
      margin-top: 3px;
      margin-bottom: 1px;
      line-height: 1.13em;
      text-shadow:0 1px 12px #35ffff18;
    }
    .animepage-genres {
      font-size: .92rem; color:#64c4ffcf; font-weight:500;
      margin-bottom:2px; opacity:.88;
    }
    .animepage-rating {
      font-size: 1.01rem; margin-bottom:1px;
      color: var(--accent);
      font-weight: bold;
      background: #1a2559b1; border-radius: 7px;
      padding: 2px 10px;
      display: inline-block;
      box-shadow: 0 0 8px 1px var(--accent2)33;
    }
    .animepage-desc {
      color: #e2e6f5da;
      font-size:1.01rem;
      font-weight: 500;
      white-space: pre-line;
      margin-top: 8px;
      line-height:1.7;
      opacity:.99;
    }
    .animepage-back-btn {
      background:var(--card-bg);
      color:var(--accent2);
      font-weight:700; border:none;
      border-radius:13px;
      padding:10px 27px;
      cursor:pointer;
      font-size:1.06rem;
      box-shadow:0 2px 16px 1px var(--accent2)48;
      margin: 27px 0 15px 0;
      transition: background var(--trans),color var(--trans);
      outline:none;
    }
    .animepage-back-btn:hover { background:var(--accent2); color:#fff; }
    .player-wrap {
      margin:10px auto 15px auto;
      width:98%; max-width:960px;
      border-radius:var(--radius16);
      background: var(--card-bg);
      padding:17px 10px 10px 10px;
      box-shadow:var(--shadow);
      display:flex; flex-direction:column; align-items:center;
      backdrop-filter: var(--blur);
    }
    .plyr__poster {
      background: #232334 !important;
    }
    .player-controls-row {
      display:flex; flex-wrap:wrap; gap:14px;
      align-items:center; justify-content:left;
      margin-bottom:7px;
      margin-top:0;
    }
    .ctrl-btn {
      border:none; outline:none;
      border-radius: 11px;
      background: var(--active);
      color:#fff;
      font-size:1.05rem;
      font-family:inherit;
      font-weight:700;
      padding:7px 22px;
      box-shadow:0 2px 11px 0 var(--accent2)25;
      cursor:pointer;
      margin-right:7px;
      transition: background var(--trans), color var(--trans), box-shadow var(--trans);
    }
    .ctrl-btn:hover, .ctrl-btn.active {
      background:var(--accent);
      color:#16214d;
      box-shadow:0 2px 14px 0 var(--accent)75;
    }
    .seria-bar {
      display:flex; gap:10px; justify-content: flex-start;
      margin:10px 0 6px 0; flex-wrap: wrap;
      overflow-x:auto;
      width:100%;
      scrollbar-width: thin;
      scrollbar-color: var(--accent2) #232437;
    }
    .seria-btn {
      border:none; outline:none;
      background-color: #202445eb;
      color:#70e9f8;
      font-weight:700; font-size:1.01rem;
      border-radius:11px;
      min-width:38px; padding:8px 0;
      box-shadow:0 0 7px 0 var(--active)18;
      letter-spacing:0.14em;
      cursor:pointer;
      transition: background var(--trans), color var(--trans), box-shadow var(--trans);
    }
    .seria-btn.active {
      background:var(--accent2);
      color:#fff;
      box-shadow:0 0 12px 2px var(--accent2)
    }
    .seria-btn:hover:not(.active) { background:var(--accent); color:#17354d;}
    ::-webkit-scrollbar {height:7px; background: #232437;}
    ::-webkit-scrollbar-thumb {background: var(--accent2); border-radius:7px;}
    @media (max-width: 1040px) { .player-wrap {max-width:100vw;} }
    @media (max-width: 720px) { .anime-grid {grid-template-columns:repeat(auto-fill,minmax(140px,1fr));} .animepage-poster{width:99vw;min-height:180px;} }
  </style>
</head>
<body>
  <nav class="nav-bar">
    <div class="logo-avatar">
      <img src="https://static.wikia.nocookie.net/azumanga/images/8/8b/Ayumu_Osaka_Kasuga.png"
           alt="Osaka Logo"
           onerror="this.outerHTML='<svg width=54 height=54 viewBox=0 0 54 54 xmlns=&quot;http://www.w3.org/2000/svg&quot;><circle cx=27 cy=27 r=26 fill=&quot;#471cc9&quot; stroke=&quot;#7df0fa&quot; stroke-width=4/><text x=50% y=54% text-anchor=&quot;middle&quot; fill=&quot;#fff&quot; font-size=14 font-family=Montserrat,Arial,sans-serif dy=.3em>Osaka Logo</text></svg>';"/>
    </div>
    <span class="logo-text">Альманах База</span>
  </nav>

  <!-- Каталог аниме -->
  <div id="catalog-screen">
    <div class="anime-grid" id="anime-grid"></div>
  </div>
  
  <!-- Экран просмотра тайтла -->
  <div id="anime-screen" style="display:none;">
    <button class="animepage-back-btn" onclick="goBackToCatalog()">← Назад к каталогу</button>
    <div class="animepage-top">
      <img class="animepage-poster" id="animepage-poster" alt="">
      <div class="animepage-desc-box">
        <div class="animepage-title" id="animepage-title"></div>
        <div class="animepage-genres" id="animepage-genres"></div>
        <div class="animepage-rating" id="animepage-rating"></div>
        <div class="animepage-desc" id="animepage-desc"></div>
      </div>
    </div>
    <div class="player-wrap">
      <div class="player-controls-row">
        <button class="ctrl-btn" id="skip-op-btn">⏭️ Пропустить опенинг</button>
      </div>
      <video id="custom-player" controls
        poster=""
        playsinline
        tabindex="0"
        style="width:100%;max-width:960px;border-radius:16px;background:#232334;"></video>
      <div class="seria-bar" id="seria-bar"></div>
      <div id="anilibria-attribution" style="color:#666;font-size:.88em;text-align:right;width:100%;opacity:.77;margin-top:8px;">Потоки: <a href="https://anilibria.tv" target="_blank" style="color:#70e9f8;text-decoration:none;">AniLibria.TV</a></div>
    </div>
  </div>

  <!-- Plyr JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.min.js"></script>
<script>
/**
 * --- 1. Каталог статичный: только аниме, реально существующие в AniLibria (русские названия, чтобы искать было проще)
 */
const animeList = [
  {title:"Клинок, рассекающий демонов", eng:"Kimetsu no Yaiba", genres:["Экшен","Демоны"], poster:"https://shikimori.one/system/animes/original/38000.jpg", rating:8.59, description:"История мщения мальчика, потерявшего семью из-за демонов."},
  {title:"Атака титанов", eng:"Shingeki no Kyojin", genres:["Экшен","Драма"], poster:"https://shikimori.one/system/animes/original/16498.jpg", rating:8.52, description:"Человечество vs титаны в стенах."},
  {title:"Магическая битва", eng:"Jujutsu Kaisen", genres:["Экшен","Мистика"], poster:"https://shikimori.one/system/animes/original/40748.jpg", rating:8.77, description:"Студенты-экзорцисты и проклятия."},
  {title:"Моб Психо 100", eng:"Mob Psycho 100", genres:["Экшен","Комедия"], poster:"https://shikimori.one/system/animes/original/32182.jpg", rating:8.57, description:"Школьник-экстрасенс, который не хочет выделяться."},
  {title:"Ванпанчмен", eng:"One Punch Man", genres:["Экшен","Комедия"], poster:"https://shikimori.one/system/animes/original/30276.jpg", rating:8.58, description:"Сайтама и герои против монстров."},
  {title:"Человек-бензопила", eng:"Chainsaw Man", genres:["Экшен","Ужасы"], poster:"https://shikimori.one/system/animes/original/48583.jpg", rating:8.57, description:"Дэнджи, демоны и бензопильная вакханалия."},
  {title:"Реинкарнация безработного", eng:"Mushoku Tensei", genres:["Исекай","Фэнтези"], poster:"https://shikimori.one/system/animes/original/41461.jpg", rating:8.37, description:"Второй шанс в магическом мире."},
  {title:"No Game No Life", eng:"No Game No Life", genres:["Игры","Комедия"], poster:"https://shikimori.one/system/animes/original/19815.jpg", rating:8.41, description:"Гений-брат и сестра попадают в игровой мир."},
  {title:"Эта фарфоровая кукла влюбилась", eng:"Sono Bisque Doll wa Koi wo Suru", genres:["Романтика"], poster:"https://shikimori.one/system/animes/original/48926.jpg", rating:8.18, description:"Косплей, любовь и шитьё костюмов."},
  {title:"Судзуми", eng:"Suzume no Tojimari", genres:["Драма"], poster:"https://shikimori.one/system/animes/original/50594.jpg", rating:8.30, description:"Магический реализ и дверь в мир катастроф."}
];

// === 2. Рендер каталога
function renderCatalog() {
  const container = document.getElementById('anime-grid');
  container.innerHTML = '';
  animeList.forEach(anime => {
    const card = document.createElement('div');
    card.className = 'anime-card';
    card.addEventListener('click', () => showAnime(anime));
    const poster = document.createElement('img');
    poster.className = 'anime-poster';
    poster.src = anime.poster;
    poster.alt = anime.title;
    card.appendChild(poster);
    const info = document.createElement('div');
    info.className = 'anime-info';
    info.innerHTML = `<div class="anime-title">${anime.title}</div>
      <div class="anime-genres">${anime.genres.join(', ')}</div>
      <div class="anime-rating">★ ${anime.rating}</div>`;
    card.appendChild(info);
    container.appendChild(card);
  });
}
renderCatalog();

// === 3. Обработка экрана тайтла и интеграции с AniLibria
let player = null;
let currentVideoList = [];
let currentAnimeTitle = '';
let currentEpisode = 1;

// Преобразование "русского" названия к поисковому запросу AniLibria
function toSearchQuery(anime) {
  // Поискать по транслиту/английскому — тогда больше попаданий через API
  return encodeURIComponent(anime.eng || anime.title);
}

async function showAnime(anime) {
  // Обновить информацию о тайтле сразу
  document.getElementById('animepage-poster').src = anime.poster;
  document.getElementById('animepage-title').textContent = anime.title;
  document.getElementById('animepage-genres').textContent = anime.genres.join(', ');
  document.getElementById('animepage-rating').textContent = `★ ${anime.rating}`;
  document.getElementById('animepage-desc').textContent = anime.description;
  document.getElementById('catalog-screen').style.display = 'none';
  document.getElementById('anime-screen').style.display = 'block';
  // Поиск через AniLibria API
  let titleQuery = toSearchQuery(anime);
  let apiUrl = 'https://api.anilibria.tv/v3/title/search?limit=3&query=' + titleQuery;
  let found = null, titleData = null;
  try {
    const res = await fetch(apiUrl);
    const data = await res.json();
    // Берем самое релевантное — сравниваем eng/rus названия
    for (const t of data.list) {
      if ((anime.title && t.names.ru && t.names.ru.trim().toLowerCase() === anime.title.trim().toLowerCase()) ||
          (anime.eng && t.names.en && t.names.en.trim().toLowerCase() === anime.eng.trim().toLowerCase())) {
        found = t;
        break;
      }
    }
    if (!found) found = data.list[0]; // Берем первый хоть какой-то
    if (!found) throw new Error("Нет подходящего тайтла");
    // Получить свежую полную карточку
    const res2 = await fetch('https://api.anilibria.tv/v3/title?id=' + found.id);
    titleData = await res2.json();
  } catch (e) {
    showError('Ошибка загрузки из AniLibria: ' + e.message);
    return;
  }
  // Получить список серий и потоков (fhd/hd/sd) из player.list
  if (!titleData || !titleData.player || !titleData.player.list) {
    showError('Серии от AniLibria не найдены.');
    return;
  }
  // Сортируем серии
  const episodeNums = Object.keys(titleData.player.list)
    .map(x => parseInt(x, 10))
    .sort((a,b)=>a-b);
  currentVideoList = episodeNums.map(num=>{
    const item = titleData.player.list[num];
    // рекурсивно ищем первый приемлемый поток fhd > hd > sd
    let src = item.hls.fhd || item.hls.hd || item.hls.sd || item.mp4.fhd || item.mp4.hd || item.mp4.sd;
    return {num, src};
  });
  currentAnimeTitle = anime.title;
  // Рендер плиток серий
  renderSeriaBar();
  // В плеер — первую серию
  playEpisode(episodeNums[0]);
}

// Ошибка загрузки тайтла с AniLibria
function showError(msg) {
  document.getElementById('seria-bar').innerHTML = `<div style="color:#ff5680;font-weight:700;">${msg}</div>`;
  if (player) player.stop && player.stop();
}

// === 4. Plyr-плеер, плитка серии и управление ===
function cleanupPlayer() {
  if (player && typeof player.destroy==='function') { player.destroy(); }
}

function renderSeriaBar() {
  const bar = document.getElementById('seria-bar');
  bar.innerHTML = '';
  currentVideoList.forEach(ep => {
    const btn = document.createElement('button');
    btn.className = 'seria-btn' + ((ep.num === currentEpisode) ? ' active' : '');
    btn.textContent = ep.num;
    btn.addEventListener('click', () => {
      if (currentEpisode !== ep.num) {
        playEpisode(ep.num);
      }
    });
    bar.appendChild(btn);
  });
}

function playEpisode(num) {
  currentEpisode = num;
  renderSeriaBar();
  // Чистим старый плеер чтобы Plyr не плодился
  cleanupPlayer();
  const vid = document.getElementById('custom-player');
  vid.innerHTML = '';
  let src = currentVideoList.find(x=>x.num===num);
  if (!src || !src.src) {
    vid.poster = '';
    showError('Поток для серии не найден.');
    return;
  }
  vid.src = src.src; // HLS/MP4 ссылка!
  vid.type = 'application/vnd.apple.mpegURL';
  vid.poster = document.getElementById('animepage-poster').src;
  vid.load();
  
  // Переинициализируем Plyr c кастомным дизайном
  player = new Plyr(vid, {
    controls: ['play-large','play','progress','current-time','mute','volume','settings','fullscreen'],
    i18n: {settings: 'Настройки', play: 'Воспроизвести', pause: 'Пауза', fullscreen: 'На весь экран'},
    settings: ['quality', 'speed'],
    quality: { default: 2, options: [0,1,2] },
    ratio: '16:9',
    poster: vid.poster,
    invertTime: false,
    hideControls: false,
  });
  player.once('ready', () => { player.play(); });
}

// === 5. Кнопка "Пропустить опенинг" ===
document.getElementById('skip-op-btn').onclick = function() {
  if (player && typeof player.currentTime === 'number') {
    player.currentTime = Math.min(player.currentTime + 85, player.duration || player.currentTime+85);
  }
}

// === 6. Возврат к каталогу ===
function goBackToCatalog() {
  document.getElementById('anime-screen').style.display = 'none';
  document.getElementById('catalog-screen').style.display = 'block';
  cleanupPlayer();
}

</script>
</body>
</html>
