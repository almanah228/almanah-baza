<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Альманах База</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="osaka-logo.png">
</head>
<body>
  <header>
    <img src="osaka-logo.png" class="logo" alt="Логотип" />
    <h1>Альманах База</h1>
    <form id="search-form">
      <input id="search-input" placeholder="Поиск аниме..."/>
    </form>
  </header>
  <aside>
    <div id="genre-panel"></div>
    <button id="genres-reset" class="genre-btn reset">Сбросить</button>
  </aside>
  <main>
    <div id="anime-grid"></div>
    <div id="catalog-end"></div>
  </main>
  <div id="modal-detail" style="display:none"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
