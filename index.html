<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Альманах База</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="layout-bg"></div>
  <header class="shiki-header">
    <img src="assets/osaka-logo.png" class="logo-img" alt="logo" />
    <span class="site-title">Альманах База</span>
    <form id="search-form" class="shiki-search">
      <input id="search-input" autocomplete="off" placeholder="Поиск аниме...">
      <button type="submit" aria-label="Найти">🔍</button>
    </form>
  </header>
  <main class="main-center">
    <aside class="genres-side">
      <h3>Жанры</h3>
      <div id="genre-panel"></div>
      <button id="genres-reset" class="genre-chip reset">Сбросить</button>
    </aside>
    <section class="center-block">
      <div id="anime-grid" class="anime-grid"></div>
      <div id="catalog-end"></div>
    </section>
  </main>
  <div id="modal-detail" style="display:none"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
