<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Альманах База</title>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
  <!-- Минималистичный, современный дизайн: чистая темная тема -->
  <style>
    :root {
      --bg: #17181c;
      --block: #23232b;
      --tile: #23232b;
      --tile-hover:#242436;
      --border: #e6e6e633;
      --accent: #52b6e6;
      --accent2: #a19cff;
      --text: #ececf2;
      --muted: #c5c7d0;
      --radius: 17px;
    }
    html,body {
      margin:0; padding:0; background:var(--bg);
      font-family:'Montserrat',Arial,sans-serif; color:var(--text);
      min-height:100vh;
    }
    body { min-height:100vh; }
    .header {
      display:flex; align-items:center; justify-content:space-between;
      background:var(--block); min-height:67px; box-shadow:0 2px 14px #191d24a6;
      padding:0 24px 0 18px; position:sticky;top:0;z-index:2;
    }
    .logo-box {
      display:flex; align-items:center; gap:19px;
    }
    .logo-img {
      width:46px; height:46px; border-radius:50%; object-fit:cover;
      background:#222230; box-shadow:0 0 5px 2px var(--accent2)20;
    }
    .sitename {
      font-size:1.29rem; font-weight:700; color:var(--text);letter-spacing:.04em
    }
    .login-btn {
      appearance:none;background:var(--accent2);color:var(--text);
      border:none;padding:9px 22px;border-radius:var(--radius);font-family:inherit;
      font-size:1.04rem;font-weight:600;cursor:pointer;box-shadow:0 3px 18px -6px var(--accent2)50;
      transition:.19s; outline:none;
    }
    .login-btn:hover { background:var(--accent); }
    .userpic {
      margin-left:15px;border-radius:50%; width:38px;height:38px;object-fit:cover;background:#333;
      border:2.5px solid var(--accent);
      vertical-align:middle;
    }
    /* Каталог */
    #catalog {max-width:1392px;margin:50px auto 0 auto;padding:0 2vw;}
    .anime-grid { display:grid; gap:27px 18px; grid-template-columns:repeat(auto-fill,minmax(210px,1fr)); }
    .anime-tile {
      background:var(--tile); border:1px solid var(--border); border-radius:var(--radius);
      display:flex;flex-direction:column;box-shadow:0 1.5px 12px 0 #14142612;
      overflow:hidden;cursor:pointer;transition:.14s;
    }
    .anime-tile:hover { border-color:var(--accent2); box-shadow:0 4px 22px 0 var(--accent)10; background:var(--tile-hover); }
    .anime-poster {width:100%;height:310px;object-fit:cover;background:#28283d;display:block;}
    .tile-info {padding:15px}
    .tile-title {font-size:1.02rem;font-weight:700;margin-bottom:8px;}
    .tile-rating {font-size:.97rem;color:var(--accent);font-weight:600; margin-bottom:0;}
    .tile-genre {font-size:.88rem;color:var(--muted);opacity:.87;}
    /* Страница просмотра */
    #viewer {display:none;}
    .video-wrap {margin:auto;width:100%;max-width:996px; border-radius:var(--radius);box-shadow:0 3px 36px #191f22a9;}
    .iframe-player {
      width:100%; height:480px; border:0; border-radius:var(--radius);background:#191921;
      box-shadow:0 1px 18px #1b243848;
      margin-bottom:0;
      display:block;
    }
    .viewer-info {display:flex;gap:30px;flex-wrap:wrap;margin:30px auto 20px auto;max-width:996px;}
    .viewer-poster {width:220px;max-width:85vw; border-radius:var(--radius);}
    .viewer-meta {flex:1; min-width:220px;}
    .viewer-title {font-size:1.37rem;font-weight:800;margin:0 0 12px 0;}
    .viewer-rating {color:var(--accent);font-weight:600;font-size:1.01rem;}
    .viewer-desc {margin-top:12px;font-size:1.01rem;color:var(--text);line-height:1.6;}
    .episode-bar {display:flex;gap:9px;overflow-x:auto;margin-top:11px;}
    .episode-btn {
      background:var(--block);color:var(--accent);
      padding:10px 0;min-width:44px; font-size:1.03rem;font-weight:700;
      border-radius:12px;border:none;box-shadow:0 0 0 1.5px var(--accent2)16;outline:none;
      cursor:pointer;transition:.12s;
    }
    .episode-btn.active, .episode-btn:focus {background:var(--accent2);color:#fff;}
    .episode-btn:hover {background:var(--accent);color:#fff;}
    .openingskip-btn {
      display:block;margin:18px auto 22px auto;background:var(--block);color:var(--accent2);
      border-radius:12px;font-size:1rem;font-weight:600;padding:9px 28px; border:none;outline:none;cursor:pointer;
      transition:.17s;
    }
    .openingskip-btn:hover {background:var(--accent2);color:#fff;}
    .back-btn {
      margin:25px 0 20px 0;background:var(--block);color:var(--accent2);font-weight:700;
      border:none;border-radius:12px;font-size:1.02rem;padding:10px 33px;cursor:pointer;transition:.17s;
    }
    .back-btn:hover {background:var(--accent2);color:#fff;}
    @media (max-width: 960px) {
      .video-wrap,.viewer-info {max-width:99vw;}
      .viewer-poster {width:150px;}
      .iframe-player {height:230px;}
    }
    @media (max-width: 630px) {
      html,body {font-size:.98rem;}
      .video-wrap,.viewer-info {max-width:99vw;}
      .viewer-poster {width:90vw;}
      .iframe-player {height:175px;}
      .anime-poster{height:180px;}
      #catalog{margin-top:20px;}
    }
  </style>
</head>
<body>
  <!-- ===== Минималистичная шапка ===== -->
  <div class="header">
    <span class="logo-box">
      <img src="https://static.wikia.nocookie.net/azumanga/images/8/8b/Ayumu_Osaka_Kasuga.png" class="logo-img" alt="Osaka Logo" />
      <span class="sitename">Альманах База</span>
    </span>
    <span id="auth-area">
      <button class="login-btn" id="login-btn">Войти через Shikimori</button>
    </span>
  </div>
  
  <!-- ========== Каталог аниме ========== -->
  <div id="catalog">
    <div style="margin-bottom:33px;font-size:1.12em;color:var(--muted)">Каталог</div>
    <div class="anime-grid" id="animeGrid"></div>
    <div id="catalog-loader" style="display:none;text-align:center;margin:28px 0;color:var(--muted)">Загружаю...</div>
  </div>
  
  <!-- ========== Страница просмотра тайтла ========== -->
  <div id="viewer">
    <button class="back-btn" onclick="goBackToCatalog()">← Назад к каталогу</button>
    <div class="video-wrap">
      <iframe class="iframe-player" id="voidboost-frame" allowfullscreen></iframe>
    </div>
    <button class="openingskip-btn" id="skip-opening" style="margin-bottom:18px">⏭️ Пропустить опенинг (+85 сек)</button>
    <div class="episode-bar" id="episodeBar"></div>
    <div class="viewer-info">
      <img class="viewer-poster" id="viewerPoster" alt />
      <div class="viewer-meta">
        <div class="viewer-title" id="viewerTitle"></div>
        <div class="viewer-rating" id="viewerRating"></div>
        <div class="viewer-desc" id="viewerDesc"></div>
      </div>
    </div>
  </div>
<script>
/* --------------------------
  Конфиг OAuth2 Shikimori 
  (замени client_id на свой при деплое! для теста годится любой паблик id)
-------------------------- */
const OAUTH_CLIENT_ID = "almanax-base-shiki";
const OAUTH_REDIRECT_URI = location.origin + location.pathname;
const OAUTH_SCOPES = "user_rates";
const SHIKI_BASE = "https://shikimori.io";
let ACCESS_TOKEN = '';
let USERNAME = '';
let completedAnimesSet = new Set();

document.getElementById('login-btn').onclick = function() {
  const params = [
    "client_id=" + encodeURIComponent(OAUTH_CLIENT_ID),
    "redirect_uri=" + encodeURIComponent(OAUTH_REDIRECT_URI),
    "response_type=token",
    "scope=" + OAUTH_SCOPES
  ].join('&');
  location.href = SHIKI_BASE + "/oauth/authorize?" + params;
};

// Parse OAuth2 hash on redirect
function parseOAuth() {
  if (location.hash.startsWith("#")) {
    const h = Object.fromEntries(location.hash.slice(1).split('&').map(pair=>pair.split('=')).map(t=>[t[0],decodeURIComponent(t[1]||'')]));
    if (h.access_token) {
      ACCESS_TOKEN = h.access_token;
      // Clean hash
      history.replaceState({},document.title,location.pathname);
    }
  }
}

// Запрос списка просмотренного
async function fetchUserCompletedList() {
  if (!ACCESS_TOKEN) return [];
  // 1. Вытащить имя пользователя из /api/users/whoami
  let res = await fetch(SHIKI_BASE + "/api/users/whoami", {
    headers: {Authorization: "Bearer "+ACCESS_TOKEN}
  });
  let whoami = await res.json();
  USERNAME = whoami.nickname;
  // 2. Теперь апи получения user_rates status=completed
  let completed = [];
  let page = 1, perPage = 500, hasMore = true;
  while (hasMore) {
    let r = await fetch(SHIKI_BASE+`/api/v2/user_rates?user_id=${whoami.id}&status=completed&page=${page}&limit=${perPage}`, {
      headers: {Authorization: "Bearer " + ACCESS_TOKEN}
    });
    let data = await r.json();
    completed.push(...data.map(x=>x.anime && x.anime.id));
    hasMore = data.length === perPage;
    page++;
  }
  completedAnimesSet = new Set(completed.filter(Boolean));
  // Изменение шапки
  document.getElementById('auth-area').innerHTML = `<img src="${whoami.image?.x160||'https://shikimori.one/img/avatars/x160/default.jpg'}" class="userpic" title="${USERNAME}"/>`;
}

// =============== Загрузка каталога с автофильтрацией ===============
let allAnimes = []; // Сериалов за все страницы
let ANIME_PER_PAGE = 50, PAGE_LIMIT = 6;

async function fetchAndRenderCatalog() {
  // Загружаем постранично только сериалы (kind=tv) и только вышедшие (status аниме)
  // Можно расширить фильтр по желанию
  document.getElementById('catalog-loader').style.display = 'block';
  let results = [];
  for (let page=1; page<=PAGE_LIMIT; page++) {
    // Можно усложнить фильтр (например, min_score, genre и т.п.)
    let r = await fetch(SHIKI_BASE+`/api/animes?limit=${ANIME_PER_PAGE}&page=${page}&kind=tv&order=popularity`);
    let data = await r.json();
    results.push(...data);
  }
  allAnimes = results.filter(anime => anime.status === "released" && anime.episodes > 0);
  renderCatalogGrid();
  document.getElementById('catalog-loader').style.display = 'none';
}

// =============== Рендер каталога ===============
function renderCatalogGrid() {
  const grid = document.getElementById('animeGrid');
  grid.innerHTML = '';
  let filtered = allAnimes.filter(anime => !completedAnimesSet.has(anime.id));
  // Краткая ошибка про просмотренное если нужно
  if (filtered.length === 0 && allAnimes.length > 0)
    grid.innerHTML = `<div style="color:var(--muted);margin:99px auto;text-align:center;">Поздравляем! Ваш список просмотренного совпадает с топом :)</div>`;
  filtered.forEach(anime => {
    const tile = document.createElement('div');
    tile.className = 'anime-tile';
    tile.onclick = () => showViewer(anime);
    tile.innerHTML = `
      <img class="anime-poster" src="${anime.image?.original||''}" alt="${anime.russian}">
      <div class="tile-info">
        <div class="tile-title">${anime.russian}</div>
        <div class="tile-rating">★ ${anime.score || '&mdash;'}</div>
        <div class="tile-genre">${(anime.genres||[]).map(g=>g.russian).join(', ')}</div>
      </div>
    `;
    grid.appendChild(tile);
  });
}

// =============== Просмотр тайтла ===============
let currentAnime = null;
let currentEpisode = 1;

function showViewer(anime) {
  currentAnime = anime;
  currentEpisode = 1;
  document.getElementById('catalog').style.display = 'none';
  document.getElementById('viewer').style.display = 'block';
  // Заполнение карточки
  document.getElementById('viewerPoster').src = anime.image?.original||'';
  document.getElementById('viewerTitle').textContent = anime.russian;
  document.getElementById('viewerRating').textContent = '★ '+(anime.score||'–');
  document.getElementById('viewerDesc').textContent = anime.description?.replace(/<br\s*\/?>/gi,"\n")||'';
  // Подключить Voidboost или Collaps плеер. Voidboost.tv лучше работает на GH Pages.
  loadPlayer(anime, currentEpisode);
  renderEpisodeBtns(anime);
}

// Генерирует ссылку на Voidboost.tv
function voidboostUrl(anime, ep) {
  // https://voidboost.tv/embed/anime?shikimori_id=ID&episode=XX
  return `https://voidboost.tv/embed/anime?shikimori_id=${anime.id}&episode=${ep}`;
}

function loadPlayer(anime, episode) {
  const frame = document.getElementById('voidboost-frame');
  frame.src = voidboostUrl(anime, episode);
}

// Отрисовать плитки серий
function renderEpisodeBtns(anime) {
  const bar = document.getElementById('episodeBar');
  bar.innerHTML = '';
  for (let i=1; i<=anime.episodes; i++) {
    const btn = document.createElement('button');
    btn.className = 'episode-btn' + (i===currentEpisode?' active':'');
    btn.textContent = i;
    btn.onclick = () => {
      currentEpisode = i;
      loadPlayer(anime, i);
      renderEpisodeBtns(anime);
    }
    bar.appendChild(btn);
  }
}

// Пропуск опенинга (работает если Voidboost поддержит postMessage в будущем)
document.getElementById('skip-opening').onclick = function() {
  const frame = document.getElementById('voidboost-frame');
  try {
    frame.contentWindow.postMessage({ type: "seek", seconds: 85 }, "*");
  } catch(e) { /*fallback: ничего*/ }
};

// Назад к каталогу
function goBackToCatalog() {
  document.getElementById('viewer').style.display = 'none';
  document.getElementById('catalog').style.display = 'block';
  document.getElementById('voidboost-frame').src = "";
}

// ================= Автоинициализация ===================
// После авторизации или просто при загрузке
async function mainFlow() {
  parseOAuth();
  if (ACCESS_TOKEN) {
    await fetchUserCompletedList();
  }
  await fetchAndRenderCatalog();
}
mainFlow();

</script>
</body>
</html>
